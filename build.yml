name: Build SyringeEx
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows‑latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: ilammy/msbuild‑action@v2

      - name: Build Release x86
        run: msbuild Syringe.sln /p:Configuration=Release /p:Platform=Win32

      - name: Upload artifact
        uses: actions/upload‑artifact@v4
        with:
          name: SyringeEx‑Release
          path: Release/Syringe.exe
