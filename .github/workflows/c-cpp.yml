name: Build SyringeEx to GitHub Release
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Solution
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe"
          & "$msbuild" Syringe.sln `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /p:AdditionalOptions=""

      - name: Upload exe to Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build
          name: Auto‑Build SyringeEx
          files: |
            Syringe/Release/Syringe.exe
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
