name: Build SyringeEx
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate & run MSBuild, override toolset to v143
        run: |
          $msbuildPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe"
          & $msbuildPath Syringe.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Upload compiled exe
        uses: actions/upload-artifact@v4
        with:
          name: SyringeEx‑Build
          path: Release/Syringe.exe
