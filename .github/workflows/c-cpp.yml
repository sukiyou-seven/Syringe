name: Build SyringeEx to GitHub Release
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find MSBuild
        id: find_msbuild
        run: |
          $path = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe"
          echo "msbuild_path=$path" >> $env:GITHUB_OUTPUT

      - name: Run MSBuild, wipe AdditionalOptions避免/Gm冲突
        run: |
          $msbuild = ${{ steps.find_msbuild.outputs.msbuild_path }}
          & $msbuild Syringe.sln `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /p:AdditionalOptions=""

      - name: Create Release & upload raw exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build
          name: Auto Build Artifact
          files: |
            Syringe/Release/Syringe.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
