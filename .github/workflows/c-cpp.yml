name: Build SyringeEx
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Release Win32 (32位，YR必须x86)
        run: msbuild Syringe.sln /p:Configuration=Release /p:Platform=Win32

      - name: Upload compiled exe
        uses: actions/upload-artifact@v4
        with:
          name: SyringeEx‑Build
          path: Release/Syringe.exe
